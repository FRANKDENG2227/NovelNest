# Xcode project definition. Regenerate NovelNest.xcodeproj with:
#   xcodegen generate
name: NovelNest
options:
  bundleIdPrefix: io.github.frankdeng2227
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  NovelNestCore:
    path: NovelNestCore
targets:
  NovelNest:
    type: application
    platform: iOS
    sources: [NovelNest]
    dependencies:
      - package: NovelNestCore
    info:
      path: NovelNest/Info.plist
      properties:
        UIBackgroundModes: [audio]   # keep reading aloud with the screen locked
        # Book sources are user-imported and many sites are plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.frankdeng2227.NovelNest
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NovelNest
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  NovelNestTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NovelNestTests]
    dependencies:
      - target: NovelNest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NovelNest.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NovelNest"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  NovelNest:
    build:
      targets:
        NovelNest: all
        NovelNestTests: [test]
    test:
      targets: [NovelNestTests]
